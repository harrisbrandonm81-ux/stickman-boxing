<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Stickman Boxing Arena</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0d1220;
      --panel: #1a2238;
      --accent: #2dd4bf;
      --danger: #f43f5e;
      --text: #dbeafe;
      --muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: radial-gradient(circle at top, #16213f, var(--bg));
      color: var(--text);
      display: grid;
      place-items: center;
      padding: 24px;
    }

    .game-shell {
      width: min(960px, 100%);
      display: grid;
      gap: 16px;
    }

    .hud {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 12px;
      align-items: center;
      background: rgba(26, 34, 56, 0.9);
      border: 1px solid rgba(148, 163, 184, 0.25);
      border-radius: 14px;
      padding: 14px 16px;
    }

    .controls,
    .stats {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      color: var(--muted);
      font-size: 0.95rem;
    }

    kbd {
      background: #0b1324;
      border: 1px solid #334155;
      border-bottom-width: 3px;
      border-radius: 6px;
      color: var(--text);
      font-size: 0.78rem;
      font-weight: 700;
      min-width: 24px;
      text-align: center;
      padding: 3px 7px;
    }

    select,
    button {
      background: #0b1324;
      color: var(--text);
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 8px 10px;
      font-size: 0.9rem;
    }

    button {
      cursor: pointer;
      border-color: #1d4ed8;
      background: linear-gradient(180deg, #1d4ed8, #1e3a8a);
    }

    .arena-wrap {
      background: rgba(26, 34, 56, 0.85);
      border: 1px solid rgba(148, 163, 184, 0.25);
      border-radius: 14px;
      padding: 12px;
    }

    canvas {
      width: 100%;
      height: auto;
      border-radius: 10px;
      background: linear-gradient(180deg, #1e293b 0%, #0f172a 65%, #081018 100%);
      display: block;
    }

    .log {
      color: var(--accent);
      font-weight: 600;
      min-height: 1.4rem;
      text-align: right;
    }

    .hp-bar {
      height: 10px;
      width: 190px;
      background: #111827;
      border-radius: 999px;
      overflow: hidden;
      border: 1px solid #334155;
      position: relative;
    }

    .hp-fill {
      position: absolute;
      inset: 0 auto 0 0;
      width: 100%;
      background: linear-gradient(90deg, #22c55e, #facc15, #ef4444);
      transition: width 120ms linear;
    }
  </style>
</head>
<body>
  <main class="game-shell">
    <section class="hud">
      <div class="controls">
        <span><strong>Move:</strong> <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd></span>
        <span><strong>Punch:</strong> <kbd>F</kbd></span>
        <span><strong>Kick:</strong> <kbd>E</kbd></span>
        <span><strong>Ability:</strong> <kbd>G</kbd></span>
        <label>
          <strong>Stickman:</strong>
          <select id="character-select"></select>
        </label>
        <button id="respawn-btn" type="button">Respawn</button>
      </div>
      <div class="stats">
        <span>You</span>
        <div class="hp-bar"><div id="player-hp" class="hp-fill"></div></div>
        <span>Enemy</span>
        <div class="hp-bar"><div id="enemy-hp" class="hp-fill"></div></div>
      </div>
    </section>

    <section class="arena-wrap">
      <canvas id="arena" width="920" height="480" aria-label="Stickman fighting arena"></canvas>
    </section>

    <div id="log" class="log">Pick a fighter and start swinging.</div>
  </main>

  <script>
    const canvas = document.getElementById('arena');
    const ctx = canvas.getContext('2d');
    const characterSelect = document.getElementById('character-select');
    const logEl = document.getElementById('log');
    const playerHpBar = document.getElementById('player-hp');
    const enemyHpBar = document.getElementById('enemy-hp');
    const respawnBtn = document.getElementById('respawn-btn');

    const fx = [];
    const keys = new Set();
    const FLOOR_Y = 360;

    let player;
    let enemy;
    let lastTs = performance.now();

    const characters = [
      {
        name: 'Blaze',
        color: '#f97316',
        ability: {
          name: 'Fire Dash',
          cooldown: 1600,
          effect(self, target) {
            const dashDir = self.facing || 1;
            self.abilityDashUntil = performance.now() + 220;
            self.abilityDashSpeed = 11 * dashDir;
            self.invulnerableUntil = performance.now() + 220;

            const inFront = (target.x - self.x) * dashDir > -12;
            if (inFront && distance(self, target) < 170) {
              hit(target, 28, `${self.name} landed Fire Dash!`, self);
              target.knockback = 6 * dashDir;
            } else {
              say(`${self.name} dashed forward in flames.`);
            }

            fx.push({
              kind: 'ring',
              x: self.x,
              y: self.y - 35,
              color: '#fb923c',
              life: 260,
              maxLife: 260,
              radius: 16
            });
          }
        }
      },
      {
        name: 'Volt',
        color: '#22d3ee',
        ability: {
          name: 'Shock Bolt',
          cooldown: 1900,
          effect(self, target) {
            const dir = self.facing || 1;
            self.castUntil = performance.now() + 280;
            fx.push({
              kind: 'projectile',
              owner: self,
              x: self.x + 28 * dir,
              y: self.y - 38,
              vx: 8.8 * dir,
              life: 900,
              maxLife: 900,
              radius: 8,
              color: '#67e8f9',
              onHit(victim) {
                hit(victim, 24, `${self.name}'s Shock Bolt stunned the enemy!`, self);
                victim.stunnedUntil = performance.now() + 700;
              }
            });
            say(`${self.name} fired Shock Bolt.`);
          }
        }
      },
      {
        name: 'Stone',
        color: '#a3a3a3',
        ability: {
          name: 'Quake Slam',
          cooldown: 2400,
          effect(self, target) {
            self.castUntil = performance.now() + 340;
            self.guardUntil = performance.now() + 900;
            const close = distance(self, target) < 200;
            const dmg = close ? 30 : 0;
            if (dmg) {
              hit(target, dmg, `${self.name} smashed the ground with Quake Slam!`, self);
              target.knockback = 4.5 * Math.sign(target.x - self.x || 1);
            } else {
              say(`${self.name} used Quake Slam, but it was out of range.`);
            }

            fx.push({
              kind: 'wave',
              x: self.x,
              y: FLOOR_Y + 18,
              life: 380,
              maxLife: 380,
              radius: 12,
              color: '#cbd5e1'
            });
          }
        }
      }
    ];

    function say(text) {
      logEl.textContent = text;
    }

    function createFighter(name, x, color) {
      return {
        name,
        x,
        y: FLOOR_Y,
        vx: 0,
        vy: 0,
        knockback: 0,
        speed: 3.1,
        hp: 100,
        maxHp: 100,
        facing: 1,
        color,
        attackUntil: 0,
        attackType: '',
        attackHitDone: false,
        abilityReadyAt: 0,
        abilityDashUntil: 0,
        abilityDashSpeed: 0,
        castUntil: 0,
        guardUntil: 0,
        stunnedUntil: 0,
        invulnerableUntil: 0,
        jumpStrength: 10,
        walkCycle: 0,
        cooldownAt: 0
      };
    }

    function resetGame() {
      const selected = characters[characterSelect.selectedIndex] || characters[0];
      player = createFighter(selected.name, 160, selected.color);
      player.profile = selected;

      enemy = createFighter('CPU Brawler', 700, '#f43f5e');
      enemy.speed = 2.25;
      enemy.profile = { ability: { name: 'Counter Guard' } };

      fx.length = 0;
      updateHpUI();
      say(`${player.name} ready. Ability: ${selected.ability.name}`);
    }

    function updateHpUI() {
      playerHpBar.style.width = `${(player.hp / player.maxHp) * 100}%`;
      enemyHpBar.style.width = `${(enemy.hp / enemy.maxHp) * 100}%`;
    }

    function distance(a, b) {
      return Math.abs(a.x - b.x);
    }

    function hit(target, amount, text, attacker) {
      if (performance.now() < target.invulnerableUntil || target.hp <= 0) return;
      const guarding = performance.now() < target.guardUntil;
      const actual = guarding ? Math.ceil(amount * 0.4) : amount;
      target.hp = Math.max(0, target.hp - actual);

      if (attacker && target.hp > 0) {
        target.facing = Math.sign(target.x - attacker.x) || target.facing;
      }

      say(guarding ? `${text} (guard reduced damage)` : text);
      updateHpUI();
    }

    function startAttack(fighter, type) {
      if (fighter.hp <= 0) return;
      const now = performance.now();
      if (now < fighter.attackUntil || now < fighter.stunnedUntil || now < fighter.castUntil) return;

      fighter.attackType = type;
      fighter.attackHitDone = false;
      fighter.attackUntil = now + (type === 'kick' ? 420 : 320);
    }

    function doAbility() {
      if (player.hp <= 0 || enemy.hp <= 0) return;
      const now = performance.now();
      if (now < player.abilityReadyAt) {
        const wait = ((player.abilityReadyAt - now) / 1000).toFixed(1);
        say(`Ability cooling down (${wait}s)`);
        return;
      }

      player.profile.ability.effect(player, enemy);
      player.abilityReadyAt = now + player.profile.ability.cooldown;
      updateHpUI();
    }

    function resolveAttackHit(attacker, defender) {
      if (attacker.attackHitDone || performance.now() > attacker.attackUntil) return;

      const total = attacker.attackType === 'kick' ? 420 : 320;
      const elapsed = total - (attacker.attackUntil - performance.now());
      const shouldLand = attacker.attackType === 'punch' ? elapsed > 110 : elapsed > 170;
      if (!shouldLand) return;

      const range = attacker.attackType === 'kick' ? 98 : 78;
      const dmg = attacker.attackType === 'kick' ? 18 : 12;
      const inFront = (defender.x - attacker.x) * (attacker.facing || 1) > -10;

      if (distance(attacker, defender) <= range && inFront) {
        hit(defender, dmg, `${attacker.name} landed a ${attacker.attackType}!`, attacker);
        defender.knockback += attacker.attackType === 'kick' ? 4 * attacker.facing : 2.6 * attacker.facing;
      } else if (attacker === player) {
        say(`${attacker.name} ${attacker.attackType} missed.`);
      }

      attacker.attackHitDone = true;
    }

    function updatePlayer(dt) {
      const now = performance.now();
      if (player.hp <= 0) return;

      let canMove = now > player.stunnedUntil && now > player.castUntil;
      player.vx = 0;

      if (now < player.abilityDashUntil) {
        player.vx = player.abilityDashSpeed;
        canMove = false;
      }

      if (canMove) {
        if (keys.has('a')) player.vx -= player.speed;
        if (keys.has('d')) player.vx += player.speed;
        if (keys.has('w') && player.y >= FLOOR_Y) player.vy = -player.jumpStrength;
        if (keys.has('s') && player.y < FLOOR_Y) player.vy += 0.55;
      }

      player.x += player.vx + player.knockback;
      player.y += player.vy;
      player.knockback *= 0.86;
      player.vy += 0.5;

      if (player.y > FLOOR_Y) {
        player.y = FLOOR_Y;
        player.vy = 0;
      }

      player.x = Math.max(40, Math.min(canvas.width - 40, player.x));
      if (player.vx !== 0) player.facing = Math.sign(player.vx);

      if (Math.abs(player.vx) > 0.2 && player.y >= FLOOR_Y) player.walkCycle += dt * 0.019;
      resolveAttackHit(player, enemy);
    }

    function updateEnemy(dt) {
      const now = performance.now();
      if (enemy.hp <= 0) return;

      if (now < enemy.stunnedUntil) {
        enemy.vx = 0;
      } else {
        const gap = player.x - enemy.x;
        const desired = Math.sign(gap) * Math.min(Math.abs(gap), enemy.speed);
        enemy.vx = desired;

        if (distance(player, enemy) > 64 && now > enemy.attackUntil) {
          enemy.x += enemy.vx;
        }

        if (enemy.vx !== 0) enemy.facing = Math.sign(gap) || enemy.facing;

        if (now > enemy.cooldownAt && distance(player, enemy) < 88 && player.hp > 0) {
          const roll = Math.random();
          if (roll > 0.55) {
            startAttack(enemy, 'punch');
          } else if (roll > 0.2) {
            startAttack(enemy, 'kick');
          } else {
            enemy.guardUntil = now + 700;
            say('CPU raised a guard.');
          }
          enemy.cooldownAt = now + 780;
        }
      }

      enemy.x += enemy.knockback;
      enemy.knockback *= 0.85;
      enemy.x = Math.max(40, Math.min(canvas.width - 40, enemy.x));
      if (Math.abs(enemy.vx) > 0.1) enemy.walkCycle += dt * 0.015;

      resolveAttackHit(enemy, player);
    }

    function updateFx(dt) {
      for (let i = fx.length - 1; i >= 0; i--) {
        const p = fx[i];
        p.life -= dt;

        if (p.kind === 'projectile') {
          p.x += p.vx;
          if (p.owner === player && distance({ x: p.x }, enemy) < 28 && Math.abs(p.y - (enemy.y - 38)) < 44 && enemy.hp > 0) {
            p.onHit(enemy);
            p.life = 0;
          }
          if (p.owner === enemy && distance({ x: p.x }, player) < 28 && Math.abs(p.y - (player.y - 38)) < 44 && player.hp > 0) {
            p.onHit(player);
            p.life = 0;
          }
        }

        if (p.life <= 0) fx.splice(i, 1);
      }
    }

    function drawGround() {
      ctx.fillStyle = '#0b1324';
      ctx.fillRect(0, 390, canvas.width, 90);

      ctx.strokeStyle = 'rgba(148, 163, 184, 0.2)';
      ctx.lineWidth = 2;
      for (let i = 0; i < canvas.width; i += 40) {
        ctx.beginPath();
        ctx.moveTo(i, 392);
        ctx.lineTo(i + 18, 480);
        ctx.stroke();
      }
    }

    function drawEffects() {
      for (const p of fx) {
        const alpha = Math.max(0, p.life / p.maxLife);
        ctx.save();
        ctx.globalAlpha = alpha;

        if (p.kind === 'projectile') {
          ctx.fillStyle = p.color;
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
          ctx.fill();
        } else if (p.kind === 'ring') {
          ctx.strokeStyle = p.color;
          ctx.lineWidth = 4;
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.radius + (1 - alpha) * 34, 0, Math.PI * 2);
          ctx.stroke();
        } else if (p.kind === 'wave') {
          ctx.strokeStyle = p.color;
          ctx.lineWidth = 5;
          ctx.beginPath();
          ctx.ellipse(p.x, p.y, p.radius + (1 - alpha) * 120, 12 + (1 - alpha) * 20, 0, 0, Math.PI * 2);
          ctx.stroke();
        }

        ctx.restore();
      }
    }

    function drawStickman(f) {
      const isPunching = performance.now() < f.attackUntil && f.attackType === 'punch';
      const isKicking = performance.now() < f.attackUntil && f.attackType === 'kick';
      const guard = performance.now() < f.guardUntil;
      const stunned = performance.now() < f.stunnedUntil;
      const walking = Math.abs(f.vx) > 0.15 && f.y >= FLOOR_Y;

      const walkSwing = walking ? Math.sin(f.walkCycle) * 20 : 0;
      const punchProgress = isPunching ? 1 - (f.attackUntil - performance.now()) / 320 : 0;
      const kickProgress = isKicking ? 1 - (f.attackUntil - performance.now()) / 420 : 0;

      const punchArm = isPunching ? 18 + Math.sin(Math.min(Math.PI, punchProgress * Math.PI)) * 46 : 14 + walkSwing * 0.15;
      const frontLeg = isKicking ? 12 + Math.sin(Math.min(Math.PI, kickProgress * Math.PI)) * 50 : 12 + walkSwing;
      const backLeg = -16 - walkSwing;

      ctx.save();
      ctx.translate(f.x, f.y);
      ctx.scale(f.facing || 1, 1);
      ctx.strokeStyle = stunned ? '#64748b' : f.color;
      ctx.lineWidth = 6;
      ctx.lineCap = 'round';

      ctx.beginPath();
      ctx.arc(0, -66, 16, 0, Math.PI * 2);
      ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(0, -50);
      ctx.lineTo(0, -10);
      ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(0, -40);
      ctx.lineTo(guard ? 8 : punchArm, guard ? -56 : -24);
      ctx.moveTo(0, -40);
      ctx.lineTo(-20 - walkSwing * 0.15, -18);
      ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(0, -10);
      ctx.lineTo(frontLeg, 24);
      ctx.moveTo(0, -10);
      ctx.lineTo(backLeg, 24);
      ctx.stroke();

      if (performance.now() < f.invulnerableUntil) {
        ctx.strokeStyle = 'rgba(251, 146, 60, 0.8)';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.arc(0, -36, 30, 0, Math.PI * 2);
        ctx.stroke();
      }

      ctx.restore();

      ctx.fillStyle = '#e2e8f0';
      ctx.font = '13px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(f.name, f.x, f.y - 95);
    }

    function drawWinner() {
      if (player.hp > 0 && enemy.hp > 0) return;
      ctx.fillStyle = 'rgba(2, 6, 23, 0.74)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = '#f8fafc';
      ctx.font = 'bold 52px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(player.hp > 0 ? 'YOU WIN' : 'YOU LOSE', canvas.width / 2, 210);
      ctx.font = '22px sans-serif';
      ctx.fillText('Press Respawn to fight again.', canvas.width / 2, 260);
    }

    function gameLoop(ts) {
      const dt = Math.min(40, ts - lastTs || 16);
      lastTs = ts;

      ctx.clearRect(0, 0, canvas.width, canvas.height);
      drawGround();
      updatePlayer(dt);
      updateEnemy(dt);
      updateFx(dt);
      drawEffects();
      drawStickman(player);
      drawStickman(enemy);
      drawWinner();
      requestAnimationFrame(gameLoop);
    }

    function initCharacterSelect() {
      characterSelect.innerHTML = '';
      for (const fighter of characters) {
        const option = document.createElement('option');
        option.value = fighter.name;
        option.textContent = `${fighter.name} (${fighter.ability.name})`;
        characterSelect.append(option);
      }
    }

    window.addEventListener('keydown', (event) => {
      const key = event.key.toLowerCase();
      if (['w', 'a', 's', 'd', 'e', 'f', 'g'].includes(key)) event.preventDefault();
      keys.add(key);

      if (key === 'f') startAttack(player, 'punch');
      if (key === 'e') startAttack(player, 'kick');
      if (key === 'g') doAbility();
    });

    window.addEventListener('keyup', (event) => {
      keys.delete(event.key.toLowerCase());
    });

    characterSelect.addEventListener('change', resetGame);
    respawnBtn.addEventListener('click', resetGame);

    initCharacterSelect();
    resetGame();
    requestAnimationFrame(gameLoop);
  </script>
</body>
</html>
