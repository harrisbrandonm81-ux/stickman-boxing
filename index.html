<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Stickman Boxing: Kinetic Update</title>
  <style>
    :root { color-scheme: dark; --bg: #0d1220; --accent: #f59e0b; --text: #e2e8f0; }
    * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { margin: 0; background: #050810; color: var(--text); display: grid; place-items: center; min-height: 100vh; overflow: hidden; }
    .game-shell { width: 940px; display: grid; gap: 10px; }
    .hud { display: flex; justify-content: space-between; background: #1a2238; padding: 15px; border-radius: 12px; border: 1px solid #334155; }
    canvas { background: linear-gradient(to bottom, #1e293b, #0f172a); border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); cursor: crosshair; }
    .hp-bar { width: 200px; height: 12px; background: #0f172a; border-radius: 6px; overflow: hidden; border: 1px solid #475569; }
    .hp-fill { height: 100%; background: linear-gradient(90deg, #ef4444, #f59e0b, #22c55e); transition: width 0.2s cubic-bezier(0.17, 0.67, 0.83, 0.67); }
    .hidden { display: none; }
    .controls-hint { font-size: 0.8rem; color: #94a3b8; }
  </style>
</head>
<body>

<div class="game-shell">
  <div class="hud">
    <div>
      <div>Player 1</div>
      <div class="hp-bar"><div id="p1-hp" class="hp-fill" style="width: 100%"></div></div>
    </div>
    <div class="controls-hint">WAD: Move | F: Punch | E: Kick | G: Special</div>
    <div style="text-align: right">
      <div>CPU / Player 2</div>
      <div class="hp-bar"><div id="p2-hp" class="hp-fill" style="width: 100%"></div></div>
    </div>
  </div>
  <canvas id="arena" width="940" height="500"></canvas>
</div>

<script>
const canvas = document.getElementById('arena');
const ctx = canvas.getContext('2d');
const FLOOR_Y = 400;
const keys = new Set();

// Physics Constants
const GRAVITY = 0.6;
const FRICTION = 0.8;
const ACCEL = 1.2;

let shake = 0;

class Fighter {
  constructor(x, color, isPlayer, controls) {
    this.x = x; this.y = FLOOR_Y;
    this.vx = 0; this.vy = 0;
    this.color = color;
    this.hp = 100;
    this.facing = isPlayer ? 1 : -1;
    this.isPlayer = isPlayer;
    this.controls = controls;
    
    // Animation States
    this.walkCycle = 0;
    this.lean = 0;
    this.animState = 'idle';
    this.attackProgress = 0;
    this.isAttacking = false;
    this.attackType = null;
    
    // Bones (Procedural offsets)
    this.head = { x: 0, y: -70 };
    this.body = { x: 0, y: -40 };
  }

  update() {
    // 1. Movement Logic
    if (this.isPlayer) {
      if (keys.has(this.controls.left)) this.vx -= ACCEL;
      if (keys.has(this.controls.right)) this.vx += ACCEL;
      if (keys.has(this.controls.up) && this.y >= FLOOR_Y) this.vy = -12;
    } else {
      // Very simple AI follow
      let dist = player.x - this.x;
      if (Math.abs(dist) > 80) this.vx += Math.sign(dist) * 0.5;
      else if (Math.random() > 0.98) this.startAttack('punch');
    }

    this.vx *= FRICTION;
    this.vy += GRAVITY;
    this.x += this.vx;
    this.y += this.vy;

    if (this.y > FLOOR_Y) { this.y = FLOOR_Y; this.vy = 0; }
    
    // Border check
    this.x = Math.max(30, Math.min(canvas.width - 30, this.x));

    // 2. Dynamic Lean (The "Lazy Fix")
    this.lean = (this.vx * 0.05);
    if (Math.abs(this.vx) > 0.2) {
      this.walkCycle += 0.15;
      this.facing = Math.sign(this.vx);
    }

    // 3. Attack Progression
    if (this.isAttacking) {
      this.attackProgress += 0.12;
      if (this.attackProgress >= 1) {
        this.isAttacking = false;
        this.attackProgress = 0;
      }
    }
  }

  startAttack(type) {
    if (this.isAttacking) return;
    this.isAttacking = true;
    this.attackType = type;
    this.attackProgress = 0;
    
    // Check Hit
    let opponent = this.isPlayer ? cpu : player;
    let range = type === 'kick' ? 90 : 60;
    if (Math.abs(this.x - opponent.x) < range && (opponent.x - this.x) * this.facing > 0) {
      opponent.takeDamage(type === 'kick' ? 10 : 5);
      shake = 8;
    }
  }

  takeDamage(amt) {
    this.hp -= amt;
    this.vx = -this.facing * 10; // Knockback
    document.getElementById(this.isPlayer ? 'p1-hp' : 'p2-hp').style.width = this.hp + '%';
  }

  draw() {
    ctx.save();
    ctx.translate(this.x, this.y);
    
    // Shake effect
    if (shake > 0) {
      ctx.translate(Math.random()*shake - shake/2, Math.random()*shake - shake/2);
    }

    ctx.strokeStyle = this.color;
    ctx.lineWidth = 5;
    ctx.lineCap = 'round';

    const f = this.facing;
    const p = Math.sin(Math.PI * this.attackProgress); // Attack curve
    const w = Math.sin(this.walkCycle); // Walk curve

    // Draw Shadow
    ctx.fillStyle = 'rgba(0,0,0,0.2)';
    ctx.beginPath();
    ctx.ellipse(0, 5, 20 + Math.abs(w)*5, 7, 0, 0, Math.PI*2);
    ctx.fill();

    // BODY CALCULATION
    ctx.rotate(this.lean);

    // Spine
    const hip = { x: 0, y: -10 };
    const chest = { x: 0, y: -45 };
    const head = { x: 0, y: -70 };

    // Draw Head
    ctx.beginPath();
    ctx.arc(head.x, head.y, 12, 0, Math.PI * 2);
    ctx.stroke();

    // Draw Torso
    ctx.beginPath();
    ctx.moveTo(hip.x, hip.y);
    ctx.lineTo(chest.x, chest.y);
    ctx.stroke();

    // ARMS (The kinetic part)
    const drawArm = (isFront, type) => {
      let armP = (isFront) ? p : 0;
      let reach = (type === 'punch' && isFront) ? p * 50 : 0;
      
      let shoulder = { x: 0, y: -40 };
      let elbow = { 
        x: (15 * f) + (reach * 0.5 * f), 
        y: -30 + (Math.cos(this.walkCycle) * 5 * (isFront ? 1 : -1)) 
      };
      let hand = { 
        x: (30 * f) + (reach * f), 
        y: -40 - (armP * 10) 
      };

      if (this.animState === 'idle' && !this.isAttacking) {
        elbow.y = -25;
        hand.y = -35;
        hand.x = (15 * f);
      }

      ctx.beginPath();
      ctx.moveTo(shoulder.x, shoulder.y);
      ctx.lineTo(elbow.x, elbow.y);
      ctx.lineTo(hand.x, hand.y);
      ctx.stroke();
    };

    // LEGS (Walk cycle physics)
    const drawLeg = (isFront) => {
      let legW = isFront ? w : -w;
      let kickP = (this.attackType === 'kick' && isFront) ? p : 0;

      let knee = { 
        x: (10 * legW * f) + (kickP * 30 * f), 
        y: 10 - (Math.abs(legW) * 5) 
      };
      let foot = { 
        x: (20 * legW * f) + (kickP * 60 * f), 
        y: 25 - (kickP * 40) 
      };

      ctx.beginPath();
      ctx.moveTo(hip.x, hip.y);
      ctx.lineTo(knee.x, knee.y);
      ctx.lineTo(foot.x, foot.y);
      ctx.stroke();
    };

    drawArm(false, this.attackType);
    drawLeg(false);
    drawLeg(true);
    drawArm(true, this.attackType);

    ctx.restore();
  }
}

const player = new Fighter(200, '#38bdf8', true, { left: 'a', right: 'd', up: 'w' });
const cpu = new Fighter(700, '#fb7185', false, {});

function loop() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  
  // Floor
  ctx.strokeStyle = '#334155';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(0, FLOOR_Y + 30);
  ctx.lineTo(canvas.width, FLOOR_Y + 30);
  ctx.stroke();

  player.update();
  cpu.update();
  
  player.draw();
  cpu.draw();

  if (shake > 0) shake *= 0.9;
  else shake = 0;

  requestAnimationFrame(loop);
}

window.addEventListener('keydown', e => {
  keys.add(e.key.toLowerCase());
  if (e.key.toLowerCase() === 'f') player.startAttack('punch');
  if (e.key.toLowerCase() === 'e') player.startAttack('kick');
});
window.addEventListener('keyup', e => keys.delete(e.key.toLowerCase()));

loop();
</script>
</body>
</html>
